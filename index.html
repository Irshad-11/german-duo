    <title>German Duo</title>
    <script>
      // Apply the saved theme before first paint (no flash). Only a non-sensitive UI preference is stored locally.
      (function () {
        try {
          var p = localStorage.getItem('gd-theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      /* shown instantly, before any JavaScript: matches the installed-app splash */
      html[data-theme='dark'] .boot { background: #1C0D13; color: #F2E8E6; }
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 10px; background: #4A1B2A; color: #FBF2EE; font: 600 30px Georgia, 'Times New Roman', serif; }
      .boot i { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: #36B8BC; } .boot i + i { background: #E8B454; margin-left: -9px; }
      .boot small { font: italic 16px Georgia, serif; opacity: .6; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><span><i></i><i></i></span>German Duo<small>Zusammen lernen</small></div></div>
    <noscript>German Duo needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
